<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">Anjora Handicrafts</title><desc id="desc">Anjora Handicrafts brand mark featuring a metallic gold letter A, colorful floral flourishes, a flowing golden ribbon and tassel, and elegant brown lettering.</desc>
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0b1"/><stop offset=".2" stop-color="#dba044"/><stop offset=".42" stop-color="#fff0a2"/><stop offset=".68" stop-color="#a35b16"/><stop offset=".84" stop-color="#f9cb62"/><stop offset="1" stop-color="#85440f"/></linearGradient>
