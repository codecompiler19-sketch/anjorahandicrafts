 <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#58d1c0"/><stop offset=".55" stop-color="#087e79"/><stop offset="1" stop-color="#034c50"/></linearGradient>
 <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff7d9b"/><stop offset=".55" stop-color="#ed3568"/><stop offset="1" stop-color="#f5a04a"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe36b"/><stop offset=".5" stop-color="#ff8a19"/><stop offset="1" stop-color="#d94b21"/></linearGradient>
</defs>
