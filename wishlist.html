<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist | Anjora Handicrafts</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <div class="header-main">
            <div class="container">
                <a href="index.html" class="logo">
                    <div class="logo-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L14.4 7.2L20 8L16 12L17 17.6L12 15L7 17.6L8 12L4 8L9.6 7.2L12 2Z"></path></svg>
                    </div>
                    <div class="logo-text">
                        <span class="logo-brand">ANJORA</span>
                        <span class="logo-tagline">Handicrafts & Heritage</span>
                    </div>
                </a>

                <div class="header-actions">
                    <a href="shop.html" class="btn btn-outline-gold btn-sm">Shop Collections</a>
                    <button class="action-btn" onclick="Cart.openDrawer()">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                        <span class="action-badge cart-count-badge" style="display: none;">0</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="page-banner">
        <div class="container">
            <h1 class="page-banner-title">My Wishlist</h1>
            <div class="breadcrumb">
                <a href="index.html">Home</a>
                <span class="breadcrumb-separator">❖</span>
                <span>Saved Treasures</span>
            </div>
        </div>
    </div>

    <main class="container" style="padding: 4rem 1.5rem;">
        <div id="wishlistContainer" class="products-grid">
            <!-- Injected by JS -->
        </div>
    </main>

    <!-- Slide-over Cart Drawer -->
    <div id="cartOverlay" class="cart-overlay" onclick="Cart.closeDrawer()"></div>
    <div id="cartDrawer" class="cart-drawer">
        <div class="cart-header">
            <h3>Your Artisan Cart</h3>
            <button class="cart-close-btn" onclick="Cart.closeDrawer()">✕</button>
        </div>
        <div id="cartShippingProgress" class="cart-free-shipping-bar"></div>
        <div id="cartDrawerItems" class="cart-items-body"></div>
        <div id="cartDrawerFooter" class="cart-footer"></div>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <div class="footer-bottom">
                <div>&copy; 2026 Anjora Handicrafts. Handcrafted in India.</div>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/products.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/main.js"></script>

    <script>
        function renderWishlist() {
            const container = document.getElementById("wishlistContainer");
            const ids = Wishlist.getItems();
            const items = PRODUCTS.filter(p => ids.includes(p.id));

            if (items.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 5rem 1rem; background: #fff; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5" style="margin-bottom:1.5rem;">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                        <h2 style="font-size: 1.5rem; color: var(--secondary); margin-bottom: 0.5rem;">Your Wishlist is Empty</h2>
                        <p style="color: var(--text-muted); margin-bottom: 2rem;">Save your favorite handcrafted brass, art, and pottery while you browse.</p>
                        <a href="shop.html" class="btn btn-primary">Browse Collections</a>
                    </div>
                `;
            } else {
                container.innerHTML = items.map(p => window.renderProductCard(p)).join("");
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderWishlist();
        });
    </script>
</body>
</html>
