<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Addresses | Anjora Handicrafts</title>
<link rel="icon" href="assets/images/anjorahandicrafts-logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css?v=20261016-customer-menu">
<style>.address-wrap{max-width:760px;margin:2.5rem auto;padding:0 1rem}.address-card{background:#fff;border:1px solid var(--border-color);border-radius:16px;padding:clamp(1.25rem,4vw,2rem)}.address-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.address-grid label{display:grid;gap:.4rem;font-weight:700;font-size:.9rem}.address-grid input,.address-grid textarea{width:100%;padding:.85rem;border:1px solid var(--border-color);border-radius:9px}@media(max-width:600px){.address-grid{grid-template-columns:1fr}}</style>
</head>
<body>
<header class="site-header"><div class="header-main"><div class="container"><a href="index.html" class="logo"><img src="assets/images/anjorahandicrafts-logo.svg" alt="Anjora Handicrafts" class="site-logo-img"></a><a href="account.html" class="account-header-btn">My Account</a></div></div></header>
<main class="address-wrap"><p><a href="account.html">← My Account</a></p><section class="address-card"><h1>My Delivery Address</h1><p style="color:var(--text-muted);margin:.5rem 0 1.5rem">Save your default delivery details for easier shopping.</p>
<form id="addressForm" class="address-grid">
<label style="grid-column:1/-1">Full name<input id="addressName" autocomplete="name" required></label>
<label>Phone number<input id="addressPhone" autocomplete="tel" type="tel" required></label>
<label>Email<input id="addressEmail" type="email" readonly></label>
<label style="grid-column:1/-1">Street address, flat, area<textarea id="addressLine" rows="2" autocomplete="street-address" required></textarea></label>
<label>City<input id="addressCity" autocomplete="address-level2" required></label>
<label>State<input id="addressState" autocomplete="address-level1" required></label>
<label>PIN code<input id="addressPin" inputmode="numeric" maxlength="6" autocomplete="postal-code" required></label>
<div style="grid-column:1/-1"><button class="btn btn-primary" id="saveAddress" type="submit">Save address</button></div>
</form><p id="addressNotice" role="status" aria-live="polite" style="margin-top:1rem"></p>
</section></main>
<script type="module">
import {initializeApp,getApps,getApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyAIg8X7TGrRmhed31LOZwqkRAK2n8SVjlI",authDomain:"anjanahandicrafts-6e4ce.firebaseapp.com",projectId:"anjanahandicrafts-6e4ce",storageBucket:"anjanahandicrafts-6e4ce.firebasestorage.app",messagingSenderId:"889895915215",appId:"1:889895915215:web:587a656ab791a3994bf1ba",measurementId:"G-WC6FWG80BB"};
const app=getApps().length?getApp():initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);let userNow=null;
onAuthStateChanged(auth,async user=>{if(!user){location.href="account.html?next=addresses";return}userNow=user;$("addressEmail").value=user.email||"";try{const s=await getDoc(doc(db,"users",user.uid));if(s.exists()){const d=s.data();$("addressName").value=d.displayName||user.displayName||"";$("addressPhone").value=d.phone||"";$("addressLine").value=d.address||"";$("addressCity").value=d.city||"";$("addressState").value=d.state||"";$("addressPin").value=d.pincode||""}}catch(e){$("addressNotice").textContent="Could not load saved address. Check Firestore setup and rules."}});
$("addressForm").addEventListener("submit",async e=>{e.preventDefault();if(!userNow)return;const pin=$("addressPin").value.trim();if(!/^\d{6}$/.test(pin)){$("addressNotice").textContent="Please enter a valid 6-digit PIN code.";return}const name=$("addressName").value.trim();$("saveAddress").disabled=true;try{await setDoc(doc(db,"users",userNow.uid),{uid:userNow.uid,email:userNow.email,displayName:name,phone:$("addressPhone").value.trim(),address:$("addressLine").value.trim(),city:$("addressCity").value.trim(),state:$("addressState").value.trim(),pincode:pin,updatedAt:new Date().toISOString()},{merge:true});$("addressNotice").textContent="Your delivery address has been saved."}catch(e){$("addressNotice").textContent="Could not save address. Confirm the published Firestore rules allow profile updates."}finally{$("saveAddress").disabled=false}});
</script><script src="assets/js/main.js?v=20261016-social-sidebar-preview"></script><script type="module" src="assets/js/auth-menu.js?v=20261016-customer-menu"></script>
</body></html>
