<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Order Details | Anjora Handicrafts</title><link rel="icon" href="assets/images/anjorahandicrafts-logo.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/css/style.css?v=20261016-customer-menu"><style>.order-detail-wrap{max-width:850px;margin:2.5rem auto;padding:0 1rem}.order-detail-card{background:#fff;border:1px solid var(--border-color);border-radius:16px;padding:clamp(1.25rem,4vw,2rem)}.order-detail-row{display:flex;justify-content:space-between;gap:1rem;padding:.8rem 0;border-bottom:1px solid var(--border-color)}</style></head>
<body><header class="site-header"><div class="header-main"><div class="container"><a href="index.html" class="logo"><img src="assets/images/anjorahandicrafts-logo.svg" alt="Anjora Handicrafts" class="site-logo-img"></a><a href="account.html" class="account-header-btn">My Account</a></div></div></header>
<main class="order-detail-wrap"><p><a href="account.html">← Back to My Account</a></p><section class="order-detail-card"><h1>Order Details</h1><p id="orderDetailStatus" role="status" style="margin:1rem 0">Loading your order…</p><div id="orderDetailBody"></div></section></main>
<script type="module">
import {initializeApp,getApps,getApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {getFirestore,doc,getDoc} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyAIg8X7TGrRmhed31LOZwqkRAK2n8SVjlI",authDomain:"anjanahandicrafts-6e4ce.firebaseapp.com",projectId:"anjanahandicrafts-6e4ce",storageBucket:"anjanahandicrafts-6e4ce.firebasestorage.app",messagingSenderId:"889895915215",appId:"1:889895915215:web:587a656ab791a3994bf1ba",measurementId:"G-WC6FWG80BB"};
const app=getApps().length?getApp():initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
const safe=v=>String(v??"—").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
onAuthStateChanged(auth,async user=>{if(!user){location.href="account.html";return}const id=new URLSearchParams(location.search).get("id");if(!id){$("orderDetailStatus").textContent="No order was selected.";return}try{const snap=await getDoc(doc(db,"orders",id));if(!snap.exists()||snap.data().userId!==user.uid){$("orderDetailStatus").textContent="This order could not be found in your account.";return}const o=snap.data();$("orderDetailStatus").textContent="Order "+(o.orderNumber||snap.id)+" · "+(o.status||"Processing");const items=Array.isArray(o.items)?o.items:[];$("orderDetailBody").innerHTML='<div class="order-detail-row"><span>Order date</span><strong>'+safe(o.createdAt?.toDate?o.createdAt.toDate().toLocaleString("en-IN"):o.createdAt)+'</strong></div><div class="order-detail-row"><span>Payment status</span><strong>'+safe(o.paymentStatus||o.status||"Pending")+'</strong></div><div class="order-detail-row"><span>Total</span><strong>'+safe(o.currency||"INR")+' '+safe(o.total??o.amount)+'</strong></div><h2 style="margin-top:1.5rem">Items</h2>'+ (items.length?items.map(i=>'<div class="order-detail-row"><span>'+safe(i.name||i.title)+' × '+safe(i.qty||i.quantity||1)+'</span><strong>'+safe(i.price??i.total)+'</strong></div>').join(""):'<p>Item details were not included in this order record.</p>')+'<h2 style="margin-top:1.5rem">Delivery details</h2><p>'+safe(o.shippingAddress?.fullName||o.customerName||"")+'</p><p>'+safe(o.shippingAddress?.address||o.address||"")+'</p><p>'+safe(o.shippingAddress?.city||o.city||"")+' '+safe(o.shippingAddress?.state||o.state||"")+' '+safe(o.shippingAddress?.pincode||o.pincode||"")+'</p>'}catch(e){$("orderDetailStatus").textContent="Order details are not available yet. Your order history must be saved to Firestore and Firestore rules must allow reading only your own orders."}});
</script><script src="assets/js/main.js?v=20261016-social-sidebar-preview"></script><script type="module" src="assets/js/auth-menu.js?v=20261016-customer-menu"></script></body></html>
